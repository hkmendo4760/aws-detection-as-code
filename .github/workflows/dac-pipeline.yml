name: Detection as Code (DaC) CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-detections:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Sigma Tooling
      run: |
        pip3 install sigma-cli
        sigma plugin install opensearch

    - name: Run Rule Validation & Compilation Test
      run: |
        chmod +x ./validate_rules.sh
        ./validate_rules.sh
